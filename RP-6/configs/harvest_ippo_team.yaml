# IPPO + Harvest, team-shared reward (shared_reward_weight = 1.0).
# Forced-cooperation end of the reward sweep. Tests whether team reward
# alone is enough to drive cooperation without a centralized critic.

env_config:
  grid_height: 8
  grid_width: 12
  num_agents: 4
  episode_length: 1000
  obs_window: 15

  initial_apple_density: 0.3
  apple_regrowth_base: 0.01
  apple_regrowth_radius: 2

  shared_reward_weight: 1.0

  seed: 42

agents:
  - "A0"
  - "A1"
  - "A2"
  - "A3"

mappo_config:
  lr: 5.0e-4
  gamma: 0.99
  lambda_: 0.95

  num_sgd_iter: 10
  sgd_minibatch_size: 32768
  train_batch_size: 32768

  clip_param: 0.2
  vf_clip_param: 10000.0  # Harvest returns are O(250-950); the default 10.0 zeros the critic gradient.
  grad_clip: 1.0
  entropy_coeff: 0.02
  vf_loss_coeff: 1.0

  vf_share_layers: false
  use_critic: true
  use_gae: true

  framework: "torch"

  multiagent:
    policies_to_train: ["shared_policy"]
    policy_mapping_fn: "lambda agent_id, episode, worker, **kwargs: 'shared_policy'"

  num_rollout_workers: 3
  num_envs_per_worker: 1
  rollout_fragment_length: 200
  batch_mode: "complete_episodes"
  sample_timeout_s: 120
  observation_filter: "MeanStdFilter"

  num_gpus: 1
  num_gpus_per_worker: 0

  evaluation_interval: 10
  evaluation_duration: 5
  evaluation_duration_unit: "episodes"
  evaluation_config:
    explore: false
    env_config:
      use_gui: false

model_config:
  custom_model: "ippo_cnn_decentralized"
  custom_model_config:
    actor_conv_specs: [[16, 3], [32, 3]]
    actor_hiddens: [128, 64]
    actor_activation: "tanh"

    critic_conv_specs: [[32, 3], [64, 3]]
    critic_hiddens: [512, 256, 128]
    critic_activation: "relu"

    use_orthogonal_init: true
    orthogonal_gain: 0.01
    use_value_normalization: true

training:
  num_iterations: 200
  checkpoint_freq: 25
  checkpoint_at_end: true
  keep_checkpoints_num: 5
  stop:
    training_iteration: 200

  log_level: "INFO"
  log_to_file: true

logging:
  tensorboard_dir: "logs/tensorboard"
  custom_metrics:
    - "total_apples_collected"
    - "gini_coefficient"
    - "sustainability"
    - "time_to_depletion"

seed: 42
torch_seed: 42
numpy_seed: 42
